# Regenerate from this directory with:
#   cbindgen --config cbindgen.toml --output include/okb_ffi.h
language = "C"
cpp_compat = true
include_guard = "OKB_FFI_H"
autogen_warning = "/* Generated by cbindgen from rust/crates/okb-ffi; do not edit. */"
usize_is_size_t = true
header = """
/*
 * C ABI over okb-shm (rust/crates/okb-shm), for the C++ test harness.
 *
 * Handles are opaque and not thread-safe: use each one only on the thread
 * that created it. Every function aborts the process if the Rust side panics
 * (C++ fatal() parity); nothing unwinds across this ABI. Passing a null
 * handle is a caller bug and also aborts, except to the _free functions.
 */"""

[export]
# okb-shm wire types become OkbConfig, OkbLayerConfig, ...; okb-ffi's own types
# are named without the prefix.
prefix = "Okb"

[parse]
parse_deps = true
include = ["okb-shm"]
